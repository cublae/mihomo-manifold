[package]
name = "mihomo-manifold"
version = "0.1.0"
edition = "2021"
description = "GTK4 GUI for the mihomo proxy core with subscriptions, HWID and split routing"
license = "GPL-3.0-or-later"

[[bin]]
name = "mihomo-manifold"
path = "src/main.rs"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
async-channel = "2.5.0"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
futures-util = "0.3.34"
gtk = { version = "0.11.4", package = "gtk4", features = ["v4_18"] }
ksni = "0.3.6"
reqwest = { version = "0.13.4", default-features = false, features = ["charset", "http2", "json", "stream", "system-proxy", "native-tls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "io-util"] }
urlencoding = "2.1.3"
uuid = { version = "1.26.0", features = ["v4", "v5", "serde"] }

[profile.release]
lto = "thin"
strip = true
